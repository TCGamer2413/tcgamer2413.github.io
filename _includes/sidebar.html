<aside class="sidebar">
  <h2>Categories</h2>

  <ul class="category-list">
    {% assign categories = site.categories | sort %}

    {% for category in categories %}
      <li>
        <a href="{{ '/categories/' | relative_url }}#{{ category[0] | slugify }}">
          {{ category[0] }}
          <span>({{ category[1].size }})</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</aside>
